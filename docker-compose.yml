services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: epasesc
      POSTGRES_USER: epasesc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [epasesc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epasesc -d epasesc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [epasesc]
    ports:
      # Exposto ao host: o navegador do usuário envia/baixa arquivos
      # diretamente aqui via URL pré-assinada (não passa pela API).
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket privado no MinIO na primeira subida e depois encerra.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks: [epasesc]
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      echo 'Bucket pronto.'
      "

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    volumes:
      # Disco/pasta de backup escolhido pelo usuário (BACKUP_HOST_PATH no
      # .env) — visto de dentro do container sempre como /backup, fixo,
      # independente de qual caminho real ele aponta no host.
      - ${BACKUP_HOST_PATH:-./backup}:/backup
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose: ["3000"]
    networks: [epasesc]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports: ["80:80"]
    networks: [epasesc]

volumes:
  postgres_data: {}
  minio_data: {}

networks:
  epasesc: {}
