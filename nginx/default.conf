server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # =============================================================================
    # Frontend - SPA (Single Page Application)
    # =============================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Este projeto não tem um passo de build que gera nomes com hash
    # (ex.: app.abc123.js), então app.js/styles.css SEMPRE têm o mesmo nome.
    # Cache longo + "immutable" nesses arquivos faz o navegador continuar
    # usando uma versão antiga por dias após uma atualização — por isso usam
    # "no-cache" (o navegador sempre revalida com o servidor, que responde
    # 304 rapidinho se nada mudou, então não há custo real de performance).
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Cache agressivo apenas para assets realmente estáticos/versionáveis
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # index.html nunca deve ficar em cache (garante que novas versões cheguem)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # =============================================================================
    # Backend - Proxy reverso para a API
    # =============================================================================
    location /api/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cookie_path / /;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
